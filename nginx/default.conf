server {
    listen 80;
    listen [::]:80;

    server_name migdas.pl www.migdas.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://migdas.pl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.migdas.pl;

    ssl_certificate /etc/letsencrypt/live/migdas.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migdas.pl/privkey.pem;

    return 301 https://migdas.pl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name migdas.pl;

    ssl_certificate /etc/letsencrypt/live/migdas.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migdas.pl/privkey.pem;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Zdjęcia produktów wgrywane w panelu (domyślny limit to 1 MB).
    client_max_body_size 16m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
